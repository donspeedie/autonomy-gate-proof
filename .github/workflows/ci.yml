# Workflow A: untrusted code runner.
# Pull request tests are untrusted code. These jobs get a read-only token,
# no secrets and no write access. They never approve or merge anything.
#
# WARNING: for a pull request from a branch in this repository, GitHub runs the
# copy of this file that is in the pull request. A pull request that edits this
# file (or adds a workflow) runs its own version. The gate refuses to merge such
# a pull request, but the edited workflow still runs once. See docs/SETUP.md,
# item "workflow-file pushes", for the control that must stop this.
name: ci

#
# A green run proves nothing about the agent's test code: a test can exit 0
# early, read the read-only job token, and reach the network. The gate trusts
# only the conclusions of this run's jobs for the pinned head SHA.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # On pull_request, the default ref is the pull request merge ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install "pytest==8.3.4"
      - name: Package tests
        run: python -m pytest -q tests

  # The gate unit tests run in a SEPARATE job, so on a separate runner. In one
  # job, every step shares the workspace and the Python installation: a file
  # under tests/ could rewrite tests_gate/ or gate.py on disk, or drop a .pth
  # file into site-packages, before the gate tests ran. This job never runs
  # tests/ and installs only pinned pytest and PyYAML.
  # A pull request under the mandate cannot change tests_gate/ or gate.py (both
  # are outside the allowlist). A human change to gate.py must pass this job.
  gate-tests:
    name: gate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned test tools
        run: python -m pip install "pytest==8.3.4" "pyyaml==6.0.2"
      - name: Gate unit tests
        run: python -I -m pytest -q -p no:cacheprovider tests_gate
